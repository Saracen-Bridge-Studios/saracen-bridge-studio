# The Saracen Bridge iPhone app (the team companion). XcodeGen makes the Xcode project from this file on the Mac:
#   brew install xcodegen && cd ios/App && xcodegen generate && open SaracenBridge.xcodeproj
# The Room's logic (invites, Studios, the loopback relay) is the RoomCore package one folder up, tested on its own.
name: SaracenBridge
options:
  bundleIdPrefix: com.saracenbridge
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en-GB
packages:
  RoomCore:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
    # shown in the app (Settings, and the Room's terms) and required by App Review: the company's address for reports
    # of abuse, and its privacy policy page. The workflow refuses to upload a build while either is empty.
    SUPPORT_EMAIL: "${SUPPORT_EMAIL}"
    PRIVACY_POLICY_URL: "${PRIVACY_POLICY_URL}"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  SaracenBridge:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: RoomCore
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Saracen Bridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.saracenbridge.room.invite
            CFBundleURLSchemes: [saracenbridge]
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Dark
        # an encrypted huddle or meeting keeps going when the screen locks (WebKit keeps the microphone with this)
        UIBackgroundModes: [audio]
        # the host's Room is on the office network at a plain address; from iOS 17, IP addresses need this exception
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Saracen Bridge connects to your production's Studio on this network.
        NSMicrophoneUsageDescription: Your microphone is used in the Room's huddles and meetings, which are end-to-end encrypted and never recorded.
        NSCameraUsageDescription: The camera scans an invite's QR code from a Studio's screen.
        NSFaceIDUsageDescription: Face ID locks the Room on this phone.
        SaracenSupportEmail: $(SUPPORT_EMAIL)
        SaracenPrivacyURL: $(PRIVACY_POLICY_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saracenbridge.room
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  SaracenBridgeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: SaracenBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saracenbridge.room.uitests
        TEST_TARGET_NAME: SaracenBridge
schemes:
  SaracenBridge:
    build:
      targets:
        SaracenBridge: all
    test:
      config: Debug
      targets: [SaracenBridgeUITests]
