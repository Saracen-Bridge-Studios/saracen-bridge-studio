# Saracen Bridge Studio for both systems, and the iPhone app.
# Every push to main runs the tests on Linux (cheap). A release tag (v*) builds everything; a manual run (Actions ›
# Build › Run workflow) builds what's picked (iPhone by default): the Mac app on one of GitHub's Apple Silicon Macs (tests, app, smoke test hosting a production, disk
# image), runs the tests on real Windows, and builds the iPhone and iPad app and runs it in the simulators against a
# Studio hosting a made-up production (screenshots of every step kept as the iphone-screenshots artifact). Mac and
# Windows minutes cost more against the account's allowance, which is why they wait for a tag or a manual run.
# The Windows installer itself is still built with packaging/build_windows_on_linux.sh.
#
# Mac signing turns on by itself once these repository secrets exist (Settings › Secrets and variables › Actions):
#   MAC_CERT_P12 (base64 of the Developer ID Application certificate, .p12), MAC_CERT_PASSWORD,
#   MAC_SIGN_IDENTITY ("Developer ID Application: <name> (<team id>)"),
#   NOTARY_KEY_P8 (App Store Connect API key, the .p8 text), NOTARY_KEY_ID, NOTARY_ISSUER.
# iPhone builds go to TestFlight by themselves once IOS_TEAM_ID exists too (the same App Store Connect API key, with
# the Admin role: Xcode's cloud signing for distribution needs it), and once the repository variables SUPPORT_EMAIL
# and PRIVACY_POLICY_URL are set (Settings › Secrets and variables › Actions › Variables): App Review requires both
# inside the app.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      only:
        description: "Which builds (Mac minutes count ten times against the allowance)"
        type: choice
        default: iphone
        options: [iphone, mac, windows, all]

jobs:
  linux-tests:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -q -r requirements-dev.txt
      - run: python -m pytest -q -p no:cacheprovider
      - name: The phone Room page parses
        run: node --check engine/room_hub/static/app.js && node --check ui/room.js

  mac:
    name: Mac (Apple Silicon)
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["mac","all"]'), inputs.only))
    runs-on: macos-15
    timeout-minutes: 90
    env:
      HAS_CERT: ${{ secrets.MAC_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - name: A throwaway keychain (the Studio seals saved keys in the Keychain; no prompts on a build machine)
        run: |
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security set-keychain-settings build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
      - name: Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm "$RUNNER_TEMP/cert.p12"
      - name: Notary key
        if: env.HAS_NOTARY == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          printf '%s\n' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
      - name: Build, test, smoke test and package
        env:
          CI_KEYCHAIN: "1"
          MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: bash packaging/build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SaracenBridgeStudio-mac
          path: dist/installer/*.dmg
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-build-logs
          path: |
            build/mac/*.log
          retention-days: 14

  windows-tests:
    name: Windows tests
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["windows","all"]'), inputs.only))
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -q -r requirements-dev.txt
      - run: python -m pytest -q -p no:cacheprovider

  iphone:
    name: iPhone and iPad app
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["iphone","all"]'), inputs.only))
    # since 28 April 2026 App Store Connect takes only builds made with Xcode 26 and the iOS 26 SDK
    runs-on: macos-26
    timeout-minutes: 75
    env:
      HAS_ASC: ${{ secrets.NOTARY_KEY_P8 != '' && secrets.IOS_TEAM_ID != '' }}
      SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
      PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
          xcodebuild -version | head -1 | grep -Eq "Xcode (2[6-9]|[3-9][0-9])" || { echo "App Store Connect needs Xcode 26 or later"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: A throwaway keychain (the test Studio seals its keys in the Keychain)
        run: |
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security set-keychain-settings build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
      - name: RoomCore tests (invites, Studios, the relay with Apple's WebSockets)
        working-directory: ios
        run: swift test
      - name: The Xcode project
        working-directory: ios/App
        run: |
          brew install xcodegen
          xcodegen generate
      - name: A Studio hosting a made-up production (The Lighthouse Keeper), seeded
        run: |
          python -m pip install -q -r requirements.txt
          STUDIO_HOME="$RUNNER_TEMP/studio" CI_KEYCHAIN=1 python studio_launcher.py --headless --port 8796 > "$RUNNER_TEMP/studio.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8796/api/health >/dev/null && break; sleep 1; done
          python ios/ci/studio_for_tests.py http://127.0.0.1:8796 seed
      - name: Build, then run in the simulators (the App Store's screenshot sizes; every step kept)
        working-directory: ios/App
        run: |
          # iPhone 6.9-inch, iPhone 6.3-inch and iPad 13-inch: each joins as a new phone, approved as an executive would
          pick() { xcrun simctl list devices available -j | python3 -c "import json,sys,re; d=json.load(sys.stdin)['devices']; print(next((x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if re.fullmatch(sys.argv[1], x['name'])), ''))" "$1"; }
          n=0
          for spec in "iPhone 1[6-9] Pro Max|6.9-inch iPhone" "iPhone 1[6-9] Pro|6.3-inch iPhone" "iPad Pro 13-inch.*|13-inch iPad"; do
            re="${spec%%|*}"; label="${spec##*|}"; n=$((n+1))
            DEVICE=$(pick "$re")
            if [ -z "$DEVICE" ]; then echo "::warning::No simulator for $label"; continue; fi
            name="UI Test $n"
            INVITE=$(python ../ci/studio_for_tests.py http://127.0.0.1:8796 invite "$name")
            python ../ci/studio_for_tests.py http://127.0.0.1:8796 approve "$name" 900 > "$RUNNER_TEMP/approve-$n.log" 2>&1 &
            TEST_RUNNER_ROOM_TEST_INVITE="$INVITE" TEST_RUNNER_ROOM_TEST_NAME="$name" xcodebuild test -project SaracenBridge.xcodeproj -scheme SaracenBridge \
              -destination "id=$DEVICE" -resultBundlePath "$RUNNER_TEMP/ui-$n.xcresult" CODE_SIGNING_ALLOWED=NO | tail -40
            echo "$label" > "$RUNNER_TEMP/ui-$n.label"
          done
      - name: Export the screenshots
        if: always()
        run: |
          mkdir -p iphone-screenshots
          for r in "$RUNNER_TEMP"/ui-*.xcresult; do
            [ -e "$r" ] || continue
            n=$(basename "$r" .xcresult); label=$(cat "$RUNNER_TEMP/$n.label" 2>/dev/null || echo "$n")
            xcrun xcresulttool export attachments --path "$r" --output-path "iphone-screenshots/$label" || true
          done
          cp "$RUNNER_TEMP/studio.log" "$RUNNER_TEMP"/approve-*.log iphone-screenshots/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-screenshots
          path: iphone-screenshots
          retention-days: 30
      - name: TestFlight (once the Apple Developer account's keys are in the repository's secrets)
        if: env.HAS_ASC == 'true' && github.event_name != 'pull_request'
        working-directory: ios/App
        env:
          ASC_KEY: ${{ secrets.NOTARY_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ASC_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          DEVELOPMENT_TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          [ -n "$SUPPORT_EMAIL" ] && [ -n "$PRIVACY_POLICY_URL" ] || { echo "Set the repository variables SUPPORT_EMAIL and PRIVACY_POLICY_URL first: App Review requires both in the app."; exit 1; }
          printf '%s\n' "$ASC_KEY" > "$RUNNER_TEMP/asc.p8"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $RUNNER_TEMP/asc.p8 -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER"
          xcodegen generate
          xcodebuild archive -project SaracenBridge.xcodeproj -scheme SaracenBridge -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/SaracenBridge.xcarchive" CURRENT_PROJECT_VERSION=${{ github.run_number }} DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" $AUTH | tail -20
          APP="$RUNNER_TEMP/SaracenBridge.xcarchive/Products/Applications/SaracenBridge.app"
          test -f "$APP/PrivacyInfo.xcprivacy" || { echo "The privacy manifest isn't in the app"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :SaracenSupportEmail" "$APP/Info.plist"
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$DEVELOPMENT_TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/SaracenBridge.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" $AUTH | tail -20
