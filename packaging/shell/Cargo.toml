[package]
name = "saracen-shell"
version = "0.4.0"
edition = "2021"
description = "Saracen Bridge Studio: the native window around the Studio's local page"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
url = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
