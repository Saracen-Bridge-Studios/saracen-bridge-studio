<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050505">
<meta name="robots" content="noindex">
<title>Sign in · Saracen Bridge Studio</title>
<link rel="icon" href="/ui/favicon.png">
<link rel="preload" href="/ui/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/ui/fonts/SourceSerif4-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/ui/studio.css">
<style>
  /* the sign-in page of the web version (1.3.0): crisp black, the crest as the jewel, one gold action */
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .gate { position: relative; z-index: 1; width: min(420px, 100%); }
  .gate .crest { display: block; width: 210px; max-width: 70%; margin: 0 auto 10px; border-radius: 12px;
    box-shadow: 0 0 0 1px rgba(242, 192, 77, .3), 0 24px 60px -24px rgba(90, 47, 160, .8); }
  .gate .sub { text-align: center; font: var(--label); letter-spacing: .62em; padding-left: .62em; color: var(--gold-300); opacity: .75; margin-bottom: 34px; }
  .gate .card { padding: 30px 28px 26px; }
  .gate h1 { font-size: 34px; margin: 0 0 6px; }
  .gate p.lede { font-size: 14px; margin-bottom: 22px; }
  .gate form { display: grid; gap: 14px; }
  .gate input { width: 100%; }
  .gate .btn.primary { width: 100%; height: 44px; margin-top: 6px; font-size: 14.5px; }
  .gate .msg { min-height: 20px; font-size: 13px; color: var(--bad); }
  .gate .foot { margin-top: 22px; text-align: center; color: var(--fg-4); font-size: 12px; }
  .gate .foot .lamp { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 7px;
    box-shadow: 0 0 0 2px rgba(130, 202, 160, .16), 0 0 10px rgba(130, 202, 160, .65); vertical-align: 1px; }
</style>
</head>
<body>
<main class="gate">
  <img class="crest" src="/ui/logo.png" alt="Saracen Bridge">
  <div class="sub">STUDIO</div>
  <div class="card">
    <h1>Sign in</h1>
    <p class="lede">Your production tools, budgets and Library, for your team.</p>
    <form id="f" autocomplete="on">
      <label class="f">Email<input id="email" type="text" inputmode="email" autocomplete="username" required autofocus></label>
      <label class="f">Password<input id="password" type="password" autocomplete="current-password" required></label>
      <div class="msg" id="msg" role="alert"></div>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
  </div>
  <div class="foot"><span class="lamp" aria-hidden="true"></span>Secure connection · your company's own server</div>
</main>
<script>
  const f = document.getElementById("f"), msg = document.getElementById("msg");
  f.addEventListener("submit", async ev => {
    ev.preventDefault();
    const b = f.querySelector("button"); b.disabled = true; msg.textContent = "";
    try {
      const r = await fetch("/api/web/login", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: document.getElementById("email").value, password: document.getElementById("password").value }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.detail || "Couldn't sign in.");
      location.replace("/");
    } catch (e) { msg.textContent = e.message; b.disabled = false; }
  });
</script>
</body>
</html>
